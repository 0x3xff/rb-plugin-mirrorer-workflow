name: Update plugins

# This workflow lives on the `workflow` branch (which must be the repository's
# default branch, or `schedule` never fires). The plugin files and the id list
# live on the `main` branch, checked out separately below.

on:
  workflow_dispatch:
    inputs:
      asset_ids:
        description: "Asset ids to add (comma separated). They get appended to plugins.json. Leave empty to just re-check the existing list."
        required: false
        type: string
      acquire_free:
        description: "If an asset is not owned but costs nothing, send the Creator Store Get request first"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Check and report only - download nothing, commit nothing"
        required: false
        type: boolean
        default: false
  schedule:
    # 04:17 UTC daily - off the hour to avoid the Actions rush
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-plugins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The scripts, from this branch.
      - name: Check out the workflow branch
        uses: actions/checkout@v4
        with:
          path: ci

      # The mirror. Naming the ref checks out the branch as it is *now*, not the
      # commit that triggered the run - otherwise a run queued before an earlier
      # one pushed would work from a stale tree.
      - name: Check out the mirror branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: mirror

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check ownership and download plugins
        id: collect
        continue-on-error: true
        working-directory: mirror
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          ASSET_IDS: ${{ inputs.asset_ids }}
          ACQUIRE_FREE: ${{ inputs.acquire_free }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLUGINS_FILE: plugins.json
          LOCK_FILE: plugins.lock.json
          OUT_DIR: plugins
          CHANGED_PATHS_FILE: ${{ runner.temp }}/changed-paths.txt
          BASE_DELAY_MS: "1200"
        run: node ../ci/scripts/update-plugins.js

      - name: Commit to the mirror branch
        if: steps.collect.outputs.changed == 'true'
        working-directory: mirror
        env:
          PATHS_FILE: ${{ runner.temp }}/changed-paths.txt
          COMMIT_TITLE: ${{ steps.collect.outputs.commit_title }}
        run: |
          set -euo pipefail
          test -s "$PATHS_FILE" || { echo "No paths recorded; nothing to commit."; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Rebuild the commit on top of the current remote tip every attempt.
            # reset --mixed keeps the working tree (our downloads) but points the
            # index at the remote tree, so staging only our own paths can never
            # conflict with, or delete, anything another run pushed meanwhile.
            git fetch --depth=1 origin main
            git reset --mixed FETCH_HEAD

            while IFS= read -r p; do
              [ -n "$p" ] || continue
              if [ -e "$p" ] || git ls-files --error-unmatch -- "$p" >/dev/null 2>&1; then
                git add -- "$p"
              fi
            done < "$PATHS_FILE"

            if git diff --cached --quiet; then
              echo "Remote already matches what this run produced; nothing to commit."
              exit 0
            fi

            git commit -q \
              -m "${COMMIT_TITLE:-Update plugins}" \
              -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; refetching and rebuilding."
            sleep 5
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Fail the run if any asset had a problem
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The collector reported failures - see the job summary above." >&2
          exit 1
