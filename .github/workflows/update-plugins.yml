name: Update plugins

on:
  workflow_dispatch:
    inputs:
      asset_ids:
        description: "Extra asset IDs to check this run (comma separated), on top of plugins.json"
        required: false
        type: string
      acquire_free:
        description: "If an asset is not owned but costs nothing, send the Creator Store Get request first"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Check and report only - download nothing, commit nothing"
        required: false
        type: boolean
        default: false
  schedule:
    # 04:17 UTC daily - off the hour to avoid the Actions rush
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: update-plugins
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check ownership and download plugins
        id: collect
        continue-on-error: true
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ASSET_IDS: ${{ inputs.asset_ids }}
          ACQUIRE_FREE: ${{ inputs.acquire_free }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLUGINS_FILE: plugins.json
          LOCK_FILE: plugins.lock.json
          OUT_DIR: plugins
          BASE_DELAY_MS: "1200"
        run: node scripts/update-plugins.js

      - name: Commit changed plugin files
        if: steps.collect.outputs.changed == 'true'
        env:
          COMMIT_TITLE: ${{ steps.collect.outputs.commit_title }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A plugins plugins.lock.json
          if git diff --cached --quiet; then
            echo "Nothing staged after all; skipping commit."
            exit 0
          fi
          git commit -m "${COMMIT_TITLE:-Update plugins}" -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The schedule and a manual run can land together; rebase onto whatever moved.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done
          echo "Could not push after 3 attempts." >&2
          exit 1

      - name: Fail the run if any asset had a problem
        if: steps.collect.outcome == 'failure'
        run: |
          echo "The collector reported failures - see the job summary above." >&2
          exit 1
